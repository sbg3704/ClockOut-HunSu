<!-- 훈수꾼 아이콘 원본(고양이 훈수). 기능: 프로그램·트레이·카탈로그 아이콘의 마스터. 사용법: tools/icons/make_app_icon.mjs가 png·ico로 만든다. 직접 고치면 스크립트를 다시 돌린다. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
<linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb04d"/><stop offset="1" stop-color="#ff8a2a"/></linearGradient>
<clipPath id="tile"><rect width="256" height="256" rx="58"/></clipPath>
<clipPath id="eL"><circle cx="86" cy="118" r="16"/></clipPath><clipPath id="eR"><circle cx="138" cy="118" r="16"/></clipPath>
</defs>
<g clip-path="url(#tile)">
<rect width="256" height="256" fill="url(#bg)"/>
<g transform="translate(-40 -30) scale(1.3) rotate(-5 112 140)">
<!-- ears -->
<path d="M54 108 L56 56 L100 80Z" fill="#ffa23e" stroke="#ffa23e" stroke-width="14" stroke-linejoin="round"/>
<path d="M170 108 L168 56 L124 80Z" fill="#ffa23e" stroke="#ffa23e" stroke-width="14" stroke-linejoin="round"/>
<path d="M64 94 L65 70 L86 82Z" fill="#ff8aa0" stroke="#ff8aa0" stroke-width="6" stroke-linejoin="round"/><path d="M160 94 L159 70 L138 82Z" fill="#ff8aa0" stroke="#ff8aa0" stroke-width="6" stroke-linejoin="round"/>
<!-- head -->
<ellipse cx="112" cy="122" rx="68" ry="58" fill="url(#fur)"/>
<g stroke="#e0701a" stroke-width="6" stroke-linecap="round"><path d="M112 72 V88"/><path d="M95 75 L98 87"/><path d="M129 75 L126 87"/></g>
<ellipse cx="112" cy="156" rx="30" ry="18" fill="#fff3e0"/>
<!-- eyes -->
<g><circle cx="86" cy="118" r="16" fill="#fff"/><circle cx="92" cy="121" r="7.5" fill="#1b1033"/><circle cx="90" cy="118" r="2.4" fill="#fff"/>
<g clip-path="url(#eL)"><rect x="66" y="100" width="40" height="17" fill="#ff9a38"/></g><path d="M69 117 H103" stroke="#1b1033" stroke-width="5" stroke-linecap="round"/>
<circle cx="138" cy="118" r="16" fill="#fff"/><circle cx="144" cy="121" r="7.5" fill="#1b1033"/><circle cx="142" cy="118" r="2.4" fill="#fff"/>
<g clip-path="url(#eR)"><rect x="118" y="100" width="40" height="17" fill="#ff9a38"/></g><path d="M121 117 H155" stroke="#1b1033" stroke-width="5" stroke-linecap="round"/></g>
<path d="M68 99 Q86 90 102 98" stroke="#1b1033" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M124 92 Q140 84 156 94" stroke="#1b1033" stroke-width="5" fill="none" stroke-linecap="round"/>
<!-- nose + mouth -->
<path d="M104 138 H120 L112 147Z" fill="#ff6f91" stroke="#ff6f91" stroke-width="3" stroke-linejoin="round"/>
<path d="M112 148 Q112 158 101 156 M112 148 Q114 160 132 150" stroke="#1b1033" stroke-width="5" fill="none" stroke-linecap="round"/>
</g>
<!-- sheet -->
<rect x="16" y="206" width="224" height="80" rx="18" fill="#fff"/>
<path d="M16 222 Q16 206 32 206 H224 Q240 206 240 222 V230 H16Z" fill="#16a36a"/>
<rect x="132" y="232" width="84" height="26" rx="6" fill="#ff4d5e"/>
<path d="M174 237 V248" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
</g></svg>